<!doctype html>
<html lang="es" class="app-preloading">
  <head>
    <meta charset="UTF-8" />
    <style>
      :root {
        --initial-loader-bg: #f6f7f9;
        --initial-loader-color: #111216;
      }

      html.app-preloading,
      html.app-preloading body,
      html.app-preloading #root {
        min-height: 100%;
        background: var(--initial-loader-bg) !important;
        color: var(--initial-loader-color);
      }

      html.app-preloading body {
        margin: 0;
      }
    </style>
    <script>
      (function () {
        try {
          var isDark = localStorage.getItem('mangamukai-theme') === 'dark';
          document.documentElement.style.setProperty('--initial-loader-bg', isDark ? '#070709' : '#f6f7f9');
          document.documentElement.style.setProperty('--initial-loader-color', isDark ? '#ffffff' : '#111216');
          document.documentElement.classList.toggle('dark', isDark);
          document.documentElement.style.colorScheme = isDark ? 'dark' : 'light';
        } catch (_) {
          document.documentElement.style.backgroundColor = '#f6f7f9';
        }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=vite" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://fonts.cdnfonts.com" crossorigin />
    <link rel="preconnect" href="https://mangamukai.com" crossorigin />
    <link rel="dns-prefetch" href="https://mangamukai.com" />
    <link href="https://fonts.googleapis.com/css2?family=Anta&family=Audiowide&family=Changa+One:ital@0;1&family=Google+Sans+Flex:opsz,wght@6..144,1..1000&family=Michroma&family=Montserrat:wght@400;500;600;700;800;900&family=Noto+Sans+Myanmar:wght@100..900&family=Open+Sans:wght@400;600;700&family=Orbitron:wght@400..900&family=Poppins:wght@400;600;700;800&family=Raleway:wght@400;500;600&family=Science+Gothic:wght@100..900&family=Share+Tech&display=swap" rel="stylesheet" />
    <link href="https://fonts.cdnfonts.com/css/garet" rel="stylesheet" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MangaMukai — Leer manga online gratis en español</title>
    <meta name="description" content="Lee manga online gratis y en español en MangaMukai: manhwa, manhua, romance, acción, fantasía, seinen y contenido +19. Capítulos nuevos cada día con lector rápido." />
    <meta name="robots" content="index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1" />
    <meta name="googlebot" content="index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1" />
    <meta name="googlebot-image" content="index,follow" />
    <link rel="canonical" href="https://mangamukai.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MangaMukai" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:title" content="MangaMukai — Leer manga online gratis en español" />
    <meta property="og:description" content="Manga, manhwa y manhua en español con capítulos nuevos cada día." />
    <meta property="og:url" content="https://mangamukai.com/" />
    <meta property="og:image" content="https://mangamukai.com/favicon.svg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@MangaMukai" />
    <!-- Identidad del sitio para Google. Los handlers PHP sustituyen este bloque
         por uno especifico de cada ruta (portada, coleccion, ficha, capitulo). -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://mangamukai.com/#organization",
            "name": "MangaMukai",
            "url": "https://mangamukai.com/",
            "logo": { "@type": "ImageObject", "url": "https://mangamukai.com/favicon.svg" },
            "sameAs": [
              "https://www.facebook.com/MangaAyanokouji/",
              "https://x.com/MangaMukai",
              "https://www.instagram.com/mangamukai/",
              "https://t.me/+J6TE0l401vRhZTYx"
            ]
          },
          {
            "@type": "WebSite",
            "@id": "https://mangamukai.com/#website",
            "url": "https://mangamukai.com/",
            "name": "MangaMukai",
            "inLanguage": "es",
            "publisher": { "@id": "https://mangamukai.com/#organization" },
            "potentialAction": {
              "@type": "SearchAction",
              "target": {
                "@type": "EntryPoint",
                "urlTemplate": "https://mangamukai.com/biblioteca?buscar={search_term_string}"
              },
              "query-input": "required name=search_term_string"
            }
          }
        ]
      }
    </script>
    <script>
      if ('scrollRestoration' in history) {
        history.scrollRestoration = 'manual';
      }
      window.scrollTo(0, 0);
      window.addEventListener('load', function() {
        requestAnimationFrame(function() {
          requestAnimationFrame(function() {
            window.scrollTo(0, 0);
          });
        });
      });
      window.addEventListener('pageshow', function() {
        requestAnimationFrame(function() {
          window.scrollTo(0, 0);
        });
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
