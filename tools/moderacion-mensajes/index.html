<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Supervisión de mensajes · MangaMukai</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f6f8; --card: #ffffff; --text: #111318; --muted: #626875; --line: #e3e6ec;
    --accent: #FF4D88; --accent-soft: rgba(255, 77, 136, 0.12); --warn: #b45309; --warn-soft: #fef3c7;
    --ok: #15803d; --ok-soft: #dcfce7; --bubble-a: #eef0f4; --bubble-b: #ffe3ec; --mark: #fff1a8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b0d12; --card: #151924; --text: #f2f4f8; --muted: #9aa3b2; --line: #262c3a;
      --accent-soft: rgba(255, 77, 136, 0.18); --warn: #fbbf24; --warn-soft: rgba(251, 191, 36, 0.14);
      --ok: #4ade80; --ok-soft: rgba(74, 222, 128, 0.14); --bubble-a: #1d2230; --bubble-b: #3a1d2a; --mark: #6b5b00;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; border: 0; border-radius: 10px; padding: 8px 14px; background: var(--accent); color: #fff; font-weight: 600; }
  button.ghost { background: transparent; border: 1px solid var(--line); color: var(--text); font-weight: 500; }
  button.link { background: none; border: 0; padding: 0; color: inherit; font-weight: inherit; text-align: left; }
  button.link:hover { color: var(--accent); }
  button:disabled { opacity: 0.5; cursor: default; }
  input, select { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; min-width: 0; }
  a { color: var(--accent); text-decoration: none; }
  code { background: var(--accent-soft); padding: 1px 5px; border-radius: 5px; font-size: 12px; }
  mark { background: var(--mark); color: inherit; border-radius: 3px; padding: 0 2px; }
  [hidden] { display: none !important; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 18px 0 8px; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 12px 20px; background: var(--card); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
  .brand { font-weight: 900; font-style: italic; letter-spacing: -0.03em; font-size: 20px; text-transform: uppercase; }
  .brand span { color: var(--accent); }
  .brand small { display: block; font: 600 11px/1 system-ui, sans-serif; letter-spacing: 0.08em; color: var(--muted); margin-top: 3px; font-style: normal; }
  .topbar-right { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: flex-end; }
  .topbar-right label { color: var(--muted); display: flex; gap: 6px; align-items: center; }
  main { max-width: 1240px; margin: 0 auto; padding: 20px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 20px; }
  .setup { max-width: 520px; margin: 60px auto; display: grid; gap: 12px; }
  .setup h1 { margin: 0; font-size: 20px; }
  .muted { color: var(--muted); }
  .error { color: #dc2626; font-weight: 600; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }
  .stat b { display: block; font-size: 24px; letter-spacing: -0.02em; }
  .stat span { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; }
  .stats.small .stat { padding: 10px 12px; }
  .stats.small .stat b { font-size: 18px; }
  .tabs { display: flex; gap: 6px; margin-bottom: 12px; }
  .tabs button { background: transparent; color: var(--muted); border-radius: 999px; }
  .tabs button.active { background: var(--accent-soft); color: var(--accent); }
  .filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
  .filters input[name="q"] { flex: 1 1 220px; }
  .filters input[name="user"] { flex: 1 1 240px; }
  .filters label { display: flex; gap: 6px; align-items: center; color: var(--muted); }
  .filters label.check { font-weight: 500; }
  .table-wrap { overflow-x: auto; background: var(--card); border: 1px solid var(--line); border-radius: 14px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
  tr:last-child td { border-bottom: 0; }
  tr.flagged td:first-child { box-shadow: inset 3px 0 0 var(--warn); }
  td.body { max-width: 520px; white-space: pre-wrap; word-break: break-word; }
  td.when { white-space: nowrap; color: var(--muted); font-size: 12px; }
  .user { display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
  .user img, .user i { width: 26px; height: 26px; border-radius: 50%; object-fit: cover; background: var(--accent-soft); display: inline-grid; place-items: center; font-style: normal; font-weight: 800; color: var(--accent); font-size: 12px; flex: none; }
  .user small { display: block; color: var(--muted); font-size: 11px; }
  .chip { display: inline-block; background: var(--warn-soft); color: var(--warn); border-radius: 999px; padding: 2px 8px; font-size: 11px; font-weight: 700; margin: 1px 2px 1px 0; }
  .chip.ok { background: var(--ok-soft); color: var(--ok); }
  .chip.neutral { background: var(--accent-soft); color: var(--accent); }
  .conversations { display: grid; gap: 8px; }
  .conversation { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; cursor: pointer; }
  .conversation:hover { border-color: var(--accent); }
  .conversation .pair { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .conversation .snippet { color: var(--muted); font-size: 12px; margin-top: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 720px; }
  .pager { display: flex; gap: 10px; align-items: center; justify-content: center; margin-top: 12px; color: var(--muted); }
  .drawer { position: fixed; top: 0; right: 0; height: 100vh; width: min(560px, 100vw); background: var(--card); border-left: 1px solid var(--line); box-shadow: -12px 0 40px rgba(0,0,0,0.18); z-index: 10; display: flex; flex-direction: column; }
  .drawer.wide { width: min(820px, 100vw); z-index: 9; }
  .drawer header { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .drawer > button { margin: 10px 16px 0; }
  .thread { flex: 1; overflow-y: auto; padding: 14px 16px; display: grid; gap: 8px; align-content: start; }
  .bubble { max-width: 85%; padding: 8px 12px; border-radius: 14px; background: var(--bubble-a); white-space: pre-wrap; word-break: break-word; }
  .bubble.right { justify-self: end; background: var(--bubble-b); }
  .bubble .meta { display: block; font-size: 11px; color: var(--muted); margin-bottom: 2px; }
  .bubble.flagged { outline: 2px solid var(--warn); }
  #more-messages { margin: 12px auto; display: block; }
  .empty { padding: 30px; text-align: center; color: var(--muted); }
  /* Usuarios */
  .user-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px; }
  .user-card { display: grid; grid-template-columns: 56px 1fr; gap: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px; cursor: pointer; align-items: start; }
  .user-card:hover { border-color: var(--accent); }
  .user-card img, .user-card i { width: 56px; height: 56px; border-radius: 14px; object-fit: cover; background: var(--accent-soft); display: grid; place-items: center; font-style: normal; font-weight: 800; color: var(--accent); font-size: 20px; }
  .user-card b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .user-card small { color: var(--muted); display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .user-card .counts { color: var(--muted); font-size: 12px; margin-top: 6px; }
  .profile { flex: 1; overflow-y: auto; }
  .hero { position: relative; height: 150px; background: linear-gradient(120deg, var(--accent), #6d28d9); background-size: cover; background-position: center; }
  .hero-body { padding: 0 20px 16px; }
  .hero-avatar { width: 96px; height: 96px; border-radius: 24px; object-fit: cover; border: 4px solid var(--card); margin-top: -48px; background: var(--accent-soft); display: grid; place-items: center; font-weight: 900; font-size: 32px; color: var(--accent); font-style: normal; }
  .hero-name { font-size: 20px; font-weight: 800; margin-top: 8px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .hero-sub { color: var(--muted); font-size: 12px; }
  .hero-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .section { padding: 0 20px; }
  .kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 8px 16px; }
  .kv div { border-bottom: 1px dashed var(--line); padding: 6px 0; }
  .kv dt { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
  .kv dd { margin: 2px 0 0; word-break: break-word; white-space: pre-wrap; }
  .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; }
  .gallery a { display: block; position: relative; aspect-ratio: 1; border-radius: 12px; overflow: hidden; background: var(--bubble-a); border: 1px solid var(--line); }
  .gallery img, .gallery video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .gallery span { position: absolute; left: 0; right: 0; bottom: 0; padding: 3px 6px; font-size: 10px; background: rgba(0,0,0,0.55); color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .friends { display: flex; flex-wrap: wrap; gap: 8px; }
  .friends button { display: grid; justify-items: center; gap: 4px; width: 72px; font-size: 11px; color: var(--muted); }
  .friends img, .friends i { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; background: var(--accent-soft); display: grid; place-items: center; font-style: normal; font-weight: 800; color: var(--accent); }
  .friends span { max-width: 72px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .posts { display: grid; gap: 8px; }
  .post { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; display: grid; grid-template-columns: 1fr auto; gap: 10px; }
  .post p { margin: 4px 0 0; white-space: pre-wrap; word-break: break-word; }
  .post img, .post video { width: 96px; height: 96px; object-fit: cover; border-radius: 10px; }
  .post .meta { font-size: 11px; color: var(--muted); }
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">Manga<span>Mukai</span><small>Supervisión de mensajes</small></div>
  <div class="topbar-right" id="topbar-right" hidden>
    <span id="site" class="muted"></span>
    <label>Auto-refresco
      <select id="refresh">
        <option value="0">apagado</option>
        <option value="30">30 s</option>
        <option value="60" selected>1 min</option>
        <option value="300">5 min</option>
      </select>
    </label>
  </div>
</header>

<main>
  <section id="setup-view" class="card setup" hidden>
    <h1>Conectando con el sitio…</h1>
    <p id="setup-message" class="muted"></p>
    <p class="muted">La conexión va integrada: la clave de supervisión se genera sola en <code id="setup-key-file"></code> y se publica en el servidor con <code>npm run deploy</code>. No hace falta iniciar sesión.</p>
    <div><button type="button" id="retry">Reintentar</button></div>
  </section>

  <section id="app-view" hidden>
    <div class="stats" id="stats"></div>
    <nav class="tabs">
      <button type="button" data-tab="messages" class="active">Mensajes</button>
      <button type="button" data-tab="conversations">Conversaciones</button>
      <button type="button" data-tab="users">Usuarios</button>
    </nav>

    <section id="tab-messages">
      <form id="filters" class="filters">
        <input name="q" placeholder="Buscar texto…">
        <input name="user" placeholder="Usuario (ID, nombre o correo)" list="user-options" autocomplete="off">
        <datalist id="user-options"></datalist>
        <label>Desde <input type="date" name="since"></label>
        <label>Hasta <input type="date" name="until"></label>
        <label class="check"><input type="checkbox" name="flagged"> Solo con señales</label>
        <button type="submit">Filtrar</button>
        <button type="button" id="clear-filters" class="ghost">Limpiar</button>
        <button type="button" id="export" class="ghost">Exportar CSV</button>
      </form>
      <p id="messages-summary" class="muted"></p>
      <div class="table-wrap">
        <table id="messages-table">
          <thead><tr><th>Fecha</th><th>De</th><th>Para</th><th>Mensaje</th><th>Señales</th><th></th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
      <button id="more-messages" class="ghost" type="button" hidden>Cargar más</button>
    </section>

    <section id="tab-conversations" hidden>
      <p id="conversations-summary" class="muted"></p>
      <div id="conversations" class="conversations"></div>
      <div class="pager">
        <button id="conv-prev" class="ghost" type="button">Anteriores</button>
        <span id="conv-page"></span>
        <button id="conv-next" class="ghost" type="button">Siguientes</button>
      </div>
    </section>

    <section id="tab-users" hidden>
      <form id="user-filters" class="filters">
        <input name="q" placeholder="Buscar usuario por nombre, correo o ID…">
        <button type="submit">Buscar</button>
        <button type="button" id="users-recent" class="ghost">Registros recientes</button>
      </form>
      <p id="users-summary" class="muted"></p>
      <div id="users" class="user-grid"></div>
      <div class="pager">
        <button id="users-prev" class="ghost" type="button">Anteriores</button>
        <span id="users-page"></span>
        <button id="users-next" class="ghost" type="button">Siguientes</button>
      </div>
    </section>
  </section>
</main>

<aside id="profile" class="drawer wide" hidden>
  <header><div id="profile-title">Usuario</div><button id="profile-close" class="ghost" type="button">Cerrar</button></header>
  <div id="profile-body" class="profile"></div>
</aside>

<aside id="thread" class="drawer" hidden>
  <header><div id="thread-title"></div><button id="thread-close" class="ghost" type="button">Cerrar</button></header>
  <button id="thread-more" class="ghost" type="button" hidden>Cargar anteriores</button>
  <div id="thread-messages" class="thread"></div>
</aside>

<script>
(() => {
  const $ = (selector) => document.querySelector(selector);
  const state = {
    keywords: [],
    filters: {},
    messages: [],
    nextBefore: null,
    total: 0,
    convPage: 1,
    convPages: 0,
    usersQuery: '',
    usersPage: 1,
    usersPages: 0,
    thread: null,
    timer: null,
    site: '',
  };

  const esc = (value) => String(value ?? '').replace(/[&<>"']/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
  const fmtDate = (iso) => iso ? new Date(iso).toLocaleString('es', { dateStyle: 'short', timeStyle: 'short' }) : '';
  const fmtDay = (iso) => iso ? new Date(iso).toLocaleDateString('es', { dateStyle: 'medium' }) : '';
  const initials = (name) => (name || '?').trim().charAt(0).toUpperCase();
  const num = (value) => Number(value || 0).toLocaleString('es');

  // Resalta palabras clave y el texto buscado ignorando mayúsculas y acentos.
  function highlight(text) {
    const terms = [...state.keywords, state.filters.q || ''].filter(Boolean);
    if (!terms.length) return esc(text);
    const plainChars = [...text].map((ch) => (ch.length === 1 ? (ch.normalize('NFD')[0] || ch) : ch));
    const plain = plainChars.join('').toLowerCase();
    const pattern = new RegExp(terms.map((t) => t.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|'), 'g');
    let out = '';
    let last = 0;
    for (const match of plain.matchAll(pattern)) {
      if (!match[0]) continue;
      out += esc(text.slice(last, match.index)) + '<mark>' + esc(text.slice(match.index, match.index + match[0].length)) + '</mark>';
      last = match.index + match[0].length;
    }
    return out + esc(text.slice(last));
  }

  function avatarHtml(user, cls) {
    return user && user.avatar
      ? `<img src="${esc(user.avatar)}" alt="" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('i'), { textContent: ${JSON.stringify(initials(user && user.username))} }))">`
      : `<i>${esc(initials(user && user.username))}</i>`;
  }

  function userHtml(user) {
    if (!user) return '<span class="user">—</span>';
    return `<span class="user">${avatarHtml(user)}<span><button type="button" class="link" data-user="${esc(user.id)}" title="Ver ficha del usuario">${esc(user.username)}</button><small>#${esc(user.id)} · ${esc(user.email || user.login || '')}</small></span></span>`;
  }

  async function api(path, params = {}) {
    const query = new URLSearchParams(Object.entries(params).filter(([, v]) => v !== undefined && v !== null && v !== ''));
    const response = await fetch(`/api/${path}${query.toString() ? `?${query}` : ''}`);
    const data = await response.json().catch(() => ({}));
    if (!response.ok || data.success === false) {
      const error = new Error(data.message || `Error HTTP ${response.status}`);
      error.status = response.status;
      throw error;
    }
    return data;
  }

  function showSetup(message) {
    stopTimer();
    $('#app-view').hidden = true;
    $('#topbar-right').hidden = true;
    $('#setup-view').hidden = false;
    $('#setup-message').textContent = message || '';
    $('#setup-message').classList.toggle('error', Boolean(message));
  }

  function stopTimer() {
    if (state.timer) clearInterval(state.timer);
    state.timer = null;
  }

  function startTimer() {
    stopTimer();
    const seconds = Number($('#refresh').value);
    if (!seconds) return;
    state.timer = setInterval(() => {
      loadOverview();
      if (!$('#tab-messages').hidden) loadMessages(true);
      else if (!$('#tab-conversations').hidden) loadConversations(state.convPage);
    }, seconds * 1000);
  }

  async function connect() {
    const info = await api('session');
    state.site = info.site || '';
    $('#site').textContent = state.site;
    $('#setup-key-file').textContent = info.keyFile || '';
    try {
      const overview = await api('mod/overview');
      $('#setup-view').hidden = true;
      $('#app-view').hidden = false;
      $('#topbar-right').hidden = false;
      renderOverview(overview);
      await loadMessages(true);
      startTimer();
    } catch (error) {
      showSetup(error.message);
    }
  }

  function renderOverview(data) {
    state.keywords = data.keywords || [];
    const t = data.totals || {};
    const tiles = [
      ['Mensajes', t.messages], ['Últimas 24 h', t.last_24h], ['Últimos 7 días', t.last_7d],
      ['Conversaciones', t.conversations], ['Usuarios que escriben', t.senders], ['Sin leer', t.unread],
    ];
    $('#stats').innerHTML = tiles.map(([label, value]) => `<div class="stat"><b>${num(value)}</b><span>${label}</span></div>`).join('')
      + (data.table === false ? '<div class="stat"><span>Todavía no existe la tabla de mensajes en el sitio.</span></div>' : '');
  }

  async function loadOverview() {
    try {
      renderOverview(await api('mod/overview'));
    } catch (error) {
      if (error.status === 401 || error.status === 403 || error.status === 404) return showSetup(error.message);
      $('#stats').innerHTML = `<div class="stat error">${esc(error.message)}</div>`;
    }
  }

  /* ---------------- Mensajes ---------------- */
  function readFilters() {
    const form = new FormData($('#filters'));
    return {
      q: String(form.get('q') || '').trim(),
      userText: String(form.get('user') || '').trim(),
      since: form.get('since') || '',
      until: form.get('until') || '',
      flagged: form.get('flagged') ? 1 : '',
    };
  }

  async function resolveUser(text) {
    if (!text) return '';
    const hashed = text.match(/#(\d+)/);
    if (hashed) return hashed[1];
    if (/^\d+$/.test(text)) return text;
    const data = await api('mod/users/search', { q: text });
    if (!data.users || !data.users.length) throw new Error(`No se encontró ningún usuario para "${text}".`);
    return String(data.users[0].id);
  }

  async function loadMessages(reset) {
    const summary = $('#messages-summary');
    const tbody = $('#messages-table tbody');
    try {
      if (reset) {
        const raw = readFilters();
        state.filters = { ...raw, user: await resolveUser(raw.userText) };
        state.messages = [];
        state.nextBefore = null;
        tbody.innerHTML = '<tr><td colspan="6" class="empty">Cargando…</td></tr>';
      }
      const { q, user, since, until, flagged } = state.filters;
      const data = await api('mod/messages', { q, user, since, until, flagged, before_id: state.nextBefore || '', per_page: 50 });
      if (reset) tbody.innerHTML = '';
      state.total = data.total || 0;
      state.nextBefore = data.next_before_id || null;
      state.messages.push(...(data.messages || []));
      for (const message of data.messages || []) tbody.insertAdjacentHTML('beforeend', messageRow(message));
      if (!state.messages.length) tbody.innerHTML = '<tr><td colspan="6" class="empty">No hay mensajes con esos filtros.</td></tr>';
      const shown = state.messages.length;
      summary.textContent = flagged
        ? `${shown} mensaje(s) con señales mostrados de ${num(state.total)} que cumplen los filtros (revisados ${data.scanned || 0} en esta carga).`
        : `${shown} de ${num(state.total)} mensaje(s). Horas en tu zona horaria.`;
      $('#more-messages').hidden = !state.nextBefore;
    } catch (error) {
      summary.textContent = '';
      tbody.innerHTML = `<tr><td colspan="6" class="empty error">${esc(error.message)}</td></tr>`;
      $('#more-messages').hidden = true;
    }
  }

  function messageRow(message) {
    const flags = (message.flags || []).map((flag) => `<span class="chip">${esc(flag)}</span>`).join('');
    return `<tr class="${message.flags && message.flags.length ? 'flagged' : ''}" data-id="${message.id}">
      <td class="when">${esc(fmtDate(message.created_at))}${message.read_at ? '' : '<br><span class="muted">sin leer</span>'}</td>
      <td>${userHtml(message.sender)}</td>
      <td>${userHtml(message.recipient)}</td>
      <td class="body">${highlight(message.body || '')}</td>
      <td>${flags}</td>
      <td><button type="button" class="ghost" data-thread="${message.sender.id},${message.recipient.id}">Conversación</button></td>
    </tr>`;
  }

  /* ---------------- Conversaciones ---------------- */
  async function loadConversations(page) {
    const list = $('#conversations');
    list.innerHTML = '<div class="empty">Cargando…</div>';
    try {
      const data = await api('mod/conversations', { page, per_page: 40, user: state.filters.user || '' });
      state.convPage = data.page || 1;
      state.convPages = data.total_pages || 0;
      $('#conversations-summary').textContent = `${num(data.total)} conversación(es)${state.filters.user ? ` del usuario #${state.filters.user}` : ''}.`;
      $('#conv-page').textContent = state.convPages ? `Página ${state.convPage} de ${state.convPages}` : '';
      $('#conv-prev').disabled = state.convPage <= 1;
      $('#conv-next').disabled = state.convPage >= state.convPages;
      if (!data.conversations || !data.conversations.length) {
        list.innerHTML = '<div class="empty">No hay conversaciones.</div>';
        return;
      }
      list.innerHTML = data.conversations.map((c) => {
        const last = c.last_message;
        const flags = last && last.flags && last.flags.length ? last.flags.map((f) => `<span class="chip">${esc(f)}</span>`).join('') : '';
        return `<div class="conversation" data-thread="${c.user_a.id},${c.user_b.id}">
          <div>
            <div class="pair">${userHtml(c.user_a)}<span class="muted">↔</span>${userHtml(c.user_b)}</div>
            <div class="snippet">${last ? `${esc(last.sender.username)}: ${esc(last.body)}` : ''}</div>
            <div>${flags}</div>
          </div>
          <div class="muted" style="text-align:right;white-space:nowrap">${c.total} mensaje(s)<br>${esc(fmtDate(c.last_at))}</div>
        </div>`;
      }).join('');
    } catch (error) {
      list.innerHTML = `<div class="empty error">${esc(error.message)}</div>`;
    }
  }

  async function openThread(a, b, before) {
    const drawer = $('#thread');
    const box = $('#thread-messages');
    if (!before) {
      state.thread = { a, b, messages: [], hasMore: false, users: [] };
      drawer.hidden = false;
      box.innerHTML = '<div class="empty">Cargando…</div>';
    }
    try {
      const data = await api(`mod/conversations/${a}/${b}`, { limit: 100, before: before || '' });
      const older = data.messages || [];
      state.thread.users = data.users || state.thread.users;
      state.thread.hasMore = Boolean(data.has_more);
      state.thread.messages = before ? [...older, ...state.thread.messages] : older;
      const [ua, ub] = state.thread.users;
      $('#thread-title').innerHTML = `${userHtml(ua)} <span class="muted">↔</span> ${userHtml(ub)}`;
      box.innerHTML = state.thread.messages.map((m) => `<div class="bubble ${m.sender.id === a ? '' : 'right'} ${m.flags && m.flags.length ? 'flagged' : ''}" data-id="${m.id}">
        <span class="meta">${esc(m.sender.username)} · ${esc(fmtDate(m.created_at))}${m.read_at ? '' : ' · sin leer'}${m.flags && m.flags.length ? ' · ' + m.flags.map(esc).join(', ') : ''}</span>${highlight(m.body || '')}</div>`).join('')
        || '<div class="empty">Sin mensajes.</div>';
      $('#thread-more').hidden = !state.thread.hasMore;
      if (!before) box.scrollTop = box.scrollHeight;
    } catch (error) {
      box.innerHTML = `<div class="empty error">${esc(error.message)}</div>`;
    }
  }

  /* ---------------- Usuarios ---------------- */
  async function loadUsers(page) {
    const grid = $('#users');
    grid.innerHTML = '<div class="empty">Cargando…</div>';
    try {
      const data = await api('mod/users', { q: state.usersQuery, page, per_page: 30 });
      state.usersPage = data.page || 1;
      state.usersPages = data.total_pages || 0;
      $('#users-summary').textContent = state.usersQuery
        ? `${num(data.total)} usuario(s) para "${state.usersQuery}".`
        : `${num(data.total)} usuario(s) registrados, los más recientes primero.`;
      $('#users-page').textContent = state.usersPages ? `Página ${state.usersPage} de ${state.usersPages}` : '';
      $('#users-prev').disabled = state.usersPage <= 1;
      $('#users-next').disabled = state.usersPage >= state.usersPages;
      if (!data.users || !data.users.length) {
        grid.innerHTML = '<div class="empty">No hay usuarios.</div>';
        return;
      }
      grid.innerHTML = data.users.map((u) => {
        const c = u.counts || {};
        return `<div class="user-card" data-user="${u.id}">
          ${avatarHtml(u)}
          <div>
            <b>${esc(u.username)} ${u.is_premium ? '<span class="chip ok">premium</span>' : ''}${u.is_pro ? '<span class="chip neutral">pro</span>' : ''}</b>
            <small>#${u.id} · @${esc(u.login)} · ${esc(u.email)}</small>
            <small>Registro ${esc(fmtDay(u.registered))}${u.location ? ' · ' + esc(u.location) : ''}${(u.roles || []).length ? ' · ' + esc(u.roles.join(', ')) : ''}</small>
            <div class="counts">✉ ${num(c.messages_sent)} enviados · ${num(c.messages_received)} recibidos · ${num(c.friends)} amigos · ${num(c.posts)} publicaciones</div>
          </div>
        </div>`;
      }).join('');
    } catch (error) {
      grid.innerHTML = `<div class="empty error">${esc(error.message)}</div>`;
    }
  }

  const SOCIAL_LABELS = { facebook: 'Facebook', twitter: 'X / Twitter', instagram: 'Instagram', discord: 'Discord', whatsapp: 'WhatsApp', telegram: 'Telegram', youtube: 'YouTube', github: 'GitHub', tiktok: 'TikTok' };

  function linkOrText(value) {
    return /^https?:\/\//i.test(value) ? `<a href="${esc(value)}" target="_blank" rel="noopener">${esc(value)}</a>` : esc(value);
  }

  async function openProfile(id) {
    const drawer = $('#profile');
    const body = $('#profile-body');
    drawer.hidden = false;
    $('#profile-title').textContent = `Usuario #${id}`;
    body.innerHTML = '<div class="empty">Cargando ficha…</div>';
    try {
      const data = await api(`mod/users/${id}`);
      const u = data.user || {};
      const p = data.profile || {};
      const a = data.account || {};
      const s = data.stats || {};
      $('#profile-title').innerHTML = `${esc(u.username)} <span class="muted">#${u.id}</span>`;
      const heroStyle = p.banner_url ? `style="background-image:url('${esc(p.banner_url)}')"` : (p.banner_color && /^#|^rgb/.test(p.banner_color) ? `style="background:${esc(p.banner_color)}"` : '');
      const avatar = u.avatar
        ? `<img class="hero-avatar" src="${esc(u.avatar)}" alt="">`
        : `<i class="hero-avatar">${esc(initials(u.username))}</i>`;
      const badges = [
        a.is_premium ? '<span class="chip ok">premium' + (a.premium_expiry ? ' hasta ' + esc(fmtDay(a.premium_expiry)) : '') + '</span>' : '',
        a.is_pro ? '<span class="chip neutral">pro</span>' : '',
        ...(a.roles || []).map((r) => `<span class="chip neutral">${esc(r)}</span>`),
      ].join('');
      const socialIds = Object.entries(a.social_ids || {}).map(([k, v]) => `${k}: ${v}`).join(' · ');
      const kv = [
        ['Correo', u.email ? `<a href="mailto:${esc(u.email)}">${esc(u.email)}</a>` : ''],
        ['Usuario (login)', u.login ? '@' + esc(u.login) : ''],
        ['Nombre público', esc(p.public_name || u.username)],
        ['Registro', esc(fmtDate(a.registered))],
        ['Último acceso', a.last_login ? esc(fmtDate(a.last_login)) : '<span class="muted">sin dato</span>'],
        ['Monedas', a.coins === null || a.coins === undefined ? '<span class="muted">sin dato</span>' : num(a.coins)],
        ['Ubicación', esc(p.location)],
        ['Fecha de nacimiento', esc(p.birth_date || p.birth_year) + (p.birth_date && !p.show_birth_date ? ' <span class="muted">(oculta en su perfil)</span>' : '')],
        ['Teléfono', p.phone ? esc((p.country_code ? p.country_code + ' ' : '') + p.phone) + (!p.show_phone ? ' <span class="muted">(oculto en su perfil)</span>' : '') : ''],
        ['Inicio de sesión social', socialIds ? esc(socialIds) : ''],
        ['Web', a.website ? linkOrText(a.website) : ''],
        ['Biografía', esc(p.bio)],
      ].filter(([, value]) => value && value !== '');
      const socials = Object.entries(p.social_links || {}).filter(([, v]) => v);
      const gallery = (data.photos || []).map((ph) => `<a href="${esc(ph.url)}" target="_blank" rel="noopener" title="${esc(ph.label)}">${ph.media_type === 'video' ? `<video src="${esc(ph.url)}" muted preload="metadata"></video>` : `<img src="${esc(ph.url)}" alt="" loading="lazy">`}<span>${esc(ph.label)}${ph.created_at ? ' · ' + esc(fmtDay(ph.created_at)) : ''}</span></a>`).join('');
      const friends = (data.friends || []).map((f) => `<button type="button" class="link" data-user="${f.id}" title="${esc(f.username)} · desde ${esc(fmtDay(f.since))}">${avatarHtml(f)}<span>${esc(f.username)}</span></button>`).join('');
      const posts = (data.posts || []).map((post) => `<div class="post">
          <div>
            <div class="meta">${esc(fmtDate(post.created_at))} · ${esc(post.visibility || 'public')}${post.status && post.status !== 'published' ? ' · ' + esc(post.status) : ''}${post.shared_post_id ? ' · compartida #' + post.shared_post_id : ''}</div>
            <p>${highlight(post.content || '')}</p>
          </div>
          ${post.media_url ? `<a href="${esc(post.media_url)}" target="_blank" rel="noopener">${post.media_type === 'video' ? `<video src="${esc(post.media_url)}" muted preload="metadata"></video>` : `<img src="${esc(post.media_url)}" alt="" loading="lazy">`}</a>` : ''}
        </div>`).join('');
      const conversations = (data.conversations || []).map((c) => `<div class="conversation" data-thread="${u.id},${c.other.id}">
          <div>
            <div class="pair">${userHtml(c.other)}</div>
            <div class="snippet">${c.last_message ? `${esc(c.last_message.sender.username)}: ${esc(c.last_message.body)}` : ''}</div>
          </div>
          <div class="muted" style="text-align:right;white-space:nowrap">${c.last_message ? esc(fmtDate(c.last_message.created_at)) : ''}</div>
        </div>`).join('');
      const tiles = [
        ['Enviados', s.messages_sent], ['Recibidos', s.messages_received], ['Conversaciones', s.conversations], ['Sin leer', s.unread_received],
        ['Amigos', s.friends], ['Solicitudes', (s.pending_sent || 0) + (s.pending_received || 0)], ['Publicaciones', s.posts], ['Con foto/vídeo', s.posts_with_media], ['Comentarios', s.comments],
      ];

      body.innerHTML = `
        <div class="hero" ${heroStyle}></div>
        <div class="hero-body">
          ${avatar}
          <div class="hero-name">${esc(u.username)} ${badges}</div>
          <div class="hero-sub">#${u.id} · @${esc(u.login)} · ${esc(u.email)}</div>
          <div class="hero-actions">
            <button type="button" id="profile-messages" data-filter-user="${u.id}">Ver sus mensajes</button>
            ${u.profile_url ? `<a class="ghost" href="${esc(u.profile_url)}" target="_blank" rel="noopener"><button type="button" class="ghost">Abrir en wp-admin</button></a>` : ''}
          </div>
        </div>
        <div class="section">
          <h2>Actividad</h2>
          <div class="stats small">${tiles.map(([label, value]) => `<div class="stat"><b>${num(value)}</b><span>${label}</span></div>`).join('')}</div>
          ${s.first_message_at ? `<p class="muted">Primer mensaje ${esc(fmtDate(s.first_message_at))} · último ${esc(fmtDate(s.last_message_at))}.</p>` : '<p class="muted">Sin mensajes.</p>'}
          <h2>Datos del perfil</h2>
          <dl class="kv">${kv.map(([k, v]) => `<div><dt>${k}</dt><dd>${v}</dd></div>`).join('')}</dl>
          ${socials.length ? `<h2>Redes</h2><dl class="kv">${socials.map(([k, v]) => `<div><dt>${esc(SOCIAL_LABELS[k] || k)}</dt><dd>${linkOrText(v)}</dd></div>`).join('')}</dl>` : ''}
          <h2>Fotos y archivos (${(data.photos || []).length})</h2>
          ${gallery ? `<div class="gallery">${gallery}</div>` : '<p class="muted">Sin imágenes propias.</p>'}
          <h2>Amigos (${s.friends || 0})</h2>
          ${friends ? `<div class="friends">${friends}</div>` : '<p class="muted">Sin amigos aceptados.</p>'}
          <h2>Conversaciones (${s.conversations || 0})</h2>
          ${conversations ? `<div class="conversations">${conversations}</div>` : '<p class="muted">Sin conversaciones.</p>'}
          <h2>Publicaciones en su perfil (${s.posts || 0})</h2>
          ${posts ? `<div class="posts">${posts}</div>` : '<p class="muted">Sin publicaciones.</p>'}
          <div style="height:24px"></div>
        </div>`;
      body.scrollTop = 0;
    } catch (error) {
      body.innerHTML = `<div class="empty error">${esc(error.message)}</div>`;
    }
  }

  function showTab(tab) {
    document.querySelectorAll('.tabs button').forEach((b) => b.classList.toggle('active', b.dataset.tab === tab));
    $('#tab-messages').hidden = tab !== 'messages';
    $('#tab-conversations').hidden = tab !== 'conversations';
    $('#tab-users').hidden = tab !== 'users';
    if (tab === 'conversations') loadConversations(1);
    if (tab === 'users') loadUsers(1);
  }

  /* ---------------- Exportar ---------------- */
  function exportCsv() {
    if (!state.messages.length) return;
    const cell = (value) => `"${String(value ?? '').replace(/"/g, '""')}"`;
    const header = ['id', 'fecha_utc', 'de_id', 'de', 'de_correo', 'para_id', 'para', 'para_correo', 'leido', 'senales', 'mensaje'];
    const rows = state.messages.map((m) => [
      m.id, m.created_at, m.sender.id, m.sender.username, m.sender.email, m.recipient.id, m.recipient.username, m.recipient.email,
      m.read_at ? 'sí' : 'no', (m.flags || []).join(' | '), m.body,
    ].map(cell).join(','));
    const blob = new Blob(['﻿' + [header.join(','), ...rows].join('\r\n')], { type: 'text/csv;charset=utf-8' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = `mensajes-mangamukai-${new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-')}.csv`;
    link.click();
    setTimeout(() => URL.revokeObjectURL(link.href), 2000);
  }

  /* ---------------- Eventos ---------------- */
  let userSearchTimer = null;
  $('#filters input[name="user"]').addEventListener('input', (event) => {
    const value = event.target.value.trim();
    clearTimeout(userSearchTimer);
    if (value.length < 2 || /^#?\d+$/.test(value)) return;
    userSearchTimer = setTimeout(async () => {
      try {
        const data = await api('mod/users/search', { q: value });
        $('#user-options').innerHTML = (data.users || []).map((u) => `<option value="#${u.id} ${esc(u.username)} (${esc(u.email)})"></option>`).join('');
      } catch {
        // Autocompletado opcional.
      }
    }, 300);
  });

  $('#retry').addEventListener('click', () => {
    $('#setup-message').textContent = 'Comprobando…';
    $('#setup-message').classList.remove('error');
    connect().catch((error) => showSetup(error.message));
  });
  $('#refresh').addEventListener('change', startTimer);
  $('#filters').addEventListener('submit', (event) => { event.preventDefault(); loadMessages(true); });
  $('#clear-filters').addEventListener('click', () => { $('#filters').reset(); loadMessages(true); });
  $('#export').addEventListener('click', exportCsv);
  $('#more-messages').addEventListener('click', () => loadMessages(false));
  $('#conv-prev').addEventListener('click', () => loadConversations(state.convPage - 1));
  $('#conv-next').addEventListener('click', () => loadConversations(state.convPage + 1));
  $('#user-filters').addEventListener('submit', (event) => {
    event.preventDefault();
    state.usersQuery = String(new FormData(event.target).get('q') || '').trim();
    loadUsers(1);
  });
  $('#users-recent').addEventListener('click', () => { $('#user-filters').reset(); state.usersQuery = ''; loadUsers(1); });
  $('#users-prev').addEventListener('click', () => loadUsers(state.usersPage - 1));
  $('#users-next').addEventListener('click', () => loadUsers(state.usersPage + 1));
  $('#thread-close').addEventListener('click', () => { $('#thread').hidden = true; state.thread = null; });
  $('#profile-close').addEventListener('click', () => { $('#profile').hidden = true; });
  $('#thread-more').addEventListener('click', () => {
    if (state.thread && state.thread.messages.length) openThread(state.thread.a, state.thread.b, state.thread.messages[0].id);
  });
  document.addEventListener('click', (event) => {
    const filterUser = event.target.closest('[data-filter-user]');
    if (filterUser) {
      $('#profile').hidden = true;
      $('#filters input[name="user"]').value = '#' + filterUser.dataset.filterUser;
      showTab('messages');
      loadMessages(true);
      return;
    }
    const userButton = event.target.closest('[data-user]');
    if (userButton) {
      openProfile(Number(userButton.dataset.user));
      return;
    }
    const target = event.target.closest('[data-thread]');
    if (!target || event.target.closest('a')) return;
    const [a, b] = target.dataset.thread.split(',').map(Number);
    openThread(a, b);
  });
  document.querySelectorAll('.tabs button').forEach((button) => button.addEventListener('click', () => showTab(button.dataset.tab)));
  document.addEventListener('keydown', (event) => {
    if (event.key !== 'Escape') return;
    if (!$('#thread').hidden) $('#thread-close').click();
    else if (!$('#profile').hidden) $('#profile-close').click();
  });

  connect().catch((error) => showSetup(error.message));
})();
</script>
</body>
</html>
